name: 导出构建（手动）

# 影子构建：只导出、打包、校验结构，产物走 workflow artifact；
# 不创建 Release、不碰线上（Android 用一次性测试签名，包不可发布）。
# 用途：在没装 Godot 的机器上验证发布链路。
# 真正的发布走 release.yml；平台细节在 _export-platforms.yml 里只维护一份。

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 平台，逗号分隔（windows / linux / android）
        required: true
        default: windows,linux,android
        type: string
      keep_days:
        description: artifact 保留天数
        required: false
        default: 7
        type: number
      include_apple:
        description: 是否跑 iOS/macOS 占位 job（macos runner 计费 10 倍，默认关）
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: export-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export:
    name: 导出
    uses: ./.github/workflows/_export-platforms.yml
    with:
      platforms: ${{ inputs.platforms }}
      keep_days: ${{ inputs.keep_days }}
      android_signing: shadow
      include_apple: ${{ inputs.include_apple }}

  summary:
    name: 汇总
    needs: export
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 结果
        shell: bash
        run: |
          {
            echo "## 影子构建完成（未发布）"
            echo ""
            echo "- 版本：\`${{ needs.export.outputs.version }}\`（build \`${{ needs.export.outputs.build }}\`）"
            echo "- Android 用一次性测试签名，**这些包不可发布**"
            echo "- 正式发版请在 GitHub 上运行「发布（手动）」工作流"
          } >> "$GITHUB_STEP_SUMMARY"
