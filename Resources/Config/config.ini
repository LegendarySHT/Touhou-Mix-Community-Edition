# 游戏配置文件
# 此文件定义游戏的基础设置和可扩展配置

[Game]
# 配置文件版本（用于兼容性检查）
config_version = "1.0.0"

# ========== 浏览设置 (Browse) ==========
[Browse]
# 专辑排序方式: creation_time（按创建时间/date字段）, download_time（按下载时间）
album_sort_method = "creation_time"

# 专辑排序方向: asc（正序）, desc（倒序）
album_sort_direction = "asc"

# ========== 常规设置 (General) ==========
[General]
# 显示调试信息 (0=关闭, 1=开启)
display_debug_info = 0

# 显示高级设置项 (0=关闭, 1=开启) - 控制是否显示部分玩家通常不需要调整的设置项
show_advanced_settings = 0

# 线上模式 (0=关闭, 1=开启)
online_mode = 0

# 自动上传成绩 (0=手动, 1=自动) - 开启后自动在结算页上传成绩，否则需手动点击上传
auto_upload_score = 1

# 语言设置 (0=英文, 1=中文)
language = 1

# 服务器地址（开发期用 http://localhost:5000，生产用域名如 https://thmix.org）
server_address = http://localhost:5000

# 重置内置资源 (0=关闭, 1=开启) - 执行后会自动重置为0
reload_builtin_resources = 0

# ========== 人物设置 (Chara) ==========
[Chara]
# 结算界面显示的人物（人物目录文件夹名，内置人物带 [内置] 后缀）
chara_id = "tenshi-stand [内置]"

# ========== 播放设置 (Playback) ==========
[Playback]
# 弹奏模式 (0=关闭, 1=开启)
performing_mode = 1

# 自动模式 (0=普通, 1=自动)
auto_mode = 0

# 播放准备动画 (0=关闭, 1=开启)
play_ready_animation = 1

# 播放速度倍率
playback_speed_scaling = 1.0

# 触摸震动反馈 (0=关闭, 1=开启)
vibrate_on_touch = 1

# 震动持续时间（毫秒）
vibration_duration = 20

# 使用系统时钟 (0=关闭, 1=开启) —— 已废弃：判定统一使用音频渲染时钟（单一音频主时钟），
# 墙钟与音频渲染在设备欠载时严重漂移。此键不再生效，保留仅为兼容旧配置。
use_system_stopwatch = 1

# 最大复音数 - 同时发声的最大音符数
max_polyphony = 256

# ========== 音源设置 (Gameplay) ==========
[Gameplay]
# 默认音源文件名（位于Resources/Soundfont/）
soundfont_file = "GeneralUser-GS.sf2"

# 默认MIDI播放音量（0-100）
default_midi_volume = 50

# 默认人声音量（0-100）
default_vocal_volume = 50

# 音频不同步阈值（毫秒，范围1-100000）
audio_sync_threshold = 30

# 音频播放延迟补偿（毫秒，正值=音频滞后需延后视觉/判定，负值=提前）
audio_playback_delay = 0

# 蓝牙输出时的音频播放延迟补偿预设（毫秒，同 audio_playback_delay 语义；首次检测到蓝牙时默认 200）
audio_playback_delay_bt = 200

# 检测到蓝牙输出时自动关闭弹奏模式 (0=关闭, 1=开启)
bt_auto_disable_performing_mode = 1


# ========== 轨道设置 (Lane) ==========
[Lane]
# 下落轨道数量
lane_count = 12

# 键盘模式 (0=关闭, 1=开启)
keyboard_mode = 0

# 键盘键位设置
keyboard_mode_keys = "A,S,D,F,J,K,L,;"

# 键盘键位显示名称（逗号分隔，空段=使用按键默认名）
keyboard_mode_display_names = ""

# 交替轨道颜色 (0=关闭, 1=开启; 仅键盘模式生效，覆盖音符颜色)
keyboard_alt_color = 1

# 交替颜色数量（最低1）
keyboard_alt_color_count = 2

# 交替颜色序列（逗号分隔的 #RRGGBB，按轨道两端对称交替）
keyboard_alt_colors = "#ff0000,#0000ff"

# 左右间距（像素；键位数为偶数时在中间额外加此间距，分隔左右手）
keyboard_mode_gap = 0

# 轨道分隔线 (0=关闭, 1=开启; 仅键盘模式生效，相邻轨道之间与两端生成竖线)
keyboard_lane_separator = 0

# 光柱不透明度 (0.0-1.0)
flash_alpha = 0.8

# 各判定「基础粒子」设定（粒子包名字，如 "Diamond-Rainbow [内置]"；空=无）
# 名字找不到（包被删除/改名/旧数字格式）自动回退无特效
perfect_spark_preset = Diamond-Rainbow [内置]
great_spark_preset = Diamond-Orange [内置]
good_spark_preset = Diamond-Orange [内置]
bad_spark_preset = Diamond-Orange [内置]

# 各判定「散射粒子/发射器」设定（粒子包名字，如 "BoxBurst [内置]"；空=无）
perfect_spark_emitter = BoxBurst [内置]
great_spark_emitter = BoxBurst [内置]
good_spark_emitter = BoxBurst [内置]
bad_spark_emitter = BoxBurst [内置]

# 整体缩放（百分比，100=原始尺寸；作用于基础粒子与散射粒子两层）
perfect_spark_scaling = 100
great_spark_scaling = 100
good_spark_scaling = 100
bad_spark_scaling = 100

# 整体不透明度（百分比，100=不透明；作用于两层）
perfect_spark_alpha = 100
great_spark_alpha = 100
good_spark_alpha = 100
bad_spark_alpha = 100

# 散射粒子专属缩放（百分比，在整体缩放基础上额外放大发射器层；默认 150）
perfect_spark_emitter_scaling = 150
great_spark_emitter_scaling = 150
good_spark_emitter_scaling = 150
bad_spark_emitter_scaling = 150

# ========== 判定设置 (Judge) ==========
[Judge]
# 判定有效区 (0=垂直全幅, 1=1s, 2=500ms, 3=250ms)
judge_window_ms = 0

# 抬手时判定滑块 (0=关闭, 1=开启)
check_instant_blocks_when_finger_up = 0

# 仅判定完美滑块 (0=关闭, 1=开启)
only_perfect_instant_blocks_before_judge = 0

# 判定线高度（像素）
judge_line_position = 200

# 音符判定宽度（判定宽度占音符宽度的倍数）
block_judging_width = 2.0

# 最小横向音符间距（轨道数，1表示至少相隔一个空轨道）
min_block_spacing = 1

# 安全区域宽度设定（像素）
canvas_horizontal_padding = 100

# Perfect判定范围（秒）
perfect_time = 0.05

# Great判定范围（秒）
great_time = 0.1

# Good判定范围（秒）
good_time = 0.15

# Bad判定范围（秒）
bad_time = 0.2

# ========== 生成设置 (Generator) ==========
[Generator]
# 生成滑块最大时间（秒）
instant_block_max_time = 0.5

# 生成短块最大时间（秒）
short_block_max_time = 1.0

# 最大并排下落音符
max_simultaneous_blocks = 2

# 连点最小时间间隔（秒）
min_tap_interval = 0.2

# 最小点击冷却时间（秒）
min_touch_cooldown_time = 0.2

# 手指最大移动速度（像素/秒）
max_touch_move_speed = 400

# 音符生成密度上限（每 1 秒最多保留的按压时刻组数；0 = 跳过密度削减）
max_block_coalesce_time = 8

# 难度预设 (0=Easy, 1=Normal, 2=Hard, 3=Lunatic, 4=Custom)
difficulty = 1

# 音符下落时间（秒）
note_fall_time = 1

# 音符下落模式 (0=匀速, 1=加速下落, 2=自定义)
note_fall_mode = 0

# 音符过判定线后的下落速度倍率 (相对于判定线前，1.0为相同)
note_fall_speed_after_judge_multiplier = 1.0

# 音符过判定线前的缓动函数（用于自定义模式）
note_fall_easing_before_func = LINEAR

# 音符过判定线前的缓动相位（用于自定义模式）
note_fall_easing_before_phase = OUT

# 音符过判定线后的缓动函数（用于自定义模式）
note_fall_easing_after_func = LINEAR

# 音符过判定线后的缓动相位（用于自定义模式）
note_fall_easing_after_phase = IN

# ========== 外观设置 (Appearance) ==========
[Appearance]
# 随机音符颜色 (0=关闭, 1=开启)
randomize_block_color = 0

# 统一音符颜色 (0=关闭, 1=开启)
sync_color_across_block_type = 0

# 滑块颜色（HTML颜色代码）
instant_block_color = "#FF6B6B"

# 点块颜色（HTML颜色代码）
short_block_color = "#4ECDC4"

# 长条颜色（HTML颜色代码）
long_block_color = "#45B7D1"

# 皮肤纹理过滤模式 (0=Nearest, 1=Bilinear)
custom_block_skin_texture_filter_mode = 0

# 音符外观设定（选择音符皮肤，自定义皮肤请放入用户目录）
block_skin_preset = "旧版2 [内置]"

# 音符尺寸大小（可游玩区域容纳的音符数量）
block_size = 6.5

# 音符发光强度 (0.0-2.0)
note_glow_intensity = 1

# 音符发光范围 (1-30)
note_glow_size = 20

# 背景闪光颜色（RGBA）
background_image_flash_color = "#00000066"

# 背景遮罩颜色（RGBA）
background_dim_color = "#00000088"

# 轨道光效宽度模式 (0=跟随音符宽度, 1=跟随轨道宽度)
beam_width_mode = 0

# 判定线粗细（像素）
judge_line_thickness = 2

# 是否连接所有并排的点块 (0=关闭, 1=开启)
generate_short_connect = 1

# 是否连接上下相邻的滑块 (0=关闭, 1=开启)
generate_instant_connect = 1

# 被连接音符的最大时间差（秒）
instant_connect_max_time = 0.5

# ========== 存储设置 (Storage) ==========
[Storage]
# 自定义资源存储路径（曲包/音源/皮肤/背景图/粒子/人物 + charts.ldb 的父目录）
# 留空 = 使用默认位置（桌面 user://files/，Android 应用私有目录）
# 修改后需通过设置页的"更改存储位置"迁移资源，直接改此值不会自动迁移
custom_storage_path = ""

# ========== 系统设置 (Display) ==========
[Display]
# 是否支持全屏
fullscreen = true

# 垂直同步
vsync_enabled = true
