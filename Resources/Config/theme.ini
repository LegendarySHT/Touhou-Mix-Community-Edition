# ============================================================
# 主题配置文件
# 颜色通过预设方案管理：每个 [preset_*] 定义强调色调色板
# 切换预设用 active_preset 键，或运行时调用 ThemeManager.apply_preset()
#
# 颜色格式：#RRGGBB 或 #RRGGBBAA（含透明度）
# 背景 type：gradient | solid | image
#
# 设计语言：深色冷调板面 + 单一强调色（现代音游风格）
#   - 板面（surface_*）与描边（border*）为全局中性色，见 [common]
#   - 预设只负责强调色（primary*）与辅色（secondary）
# ============================================================

[Theme]
version = "2.0.0"
# 当前预设：blue | pink | green | yellow | violet | cyan
active_preset = "blue"
# 外观模式：dark（深色，默认） | light（浅色，以主题色为主的同色相浅染，非通用灰白）
appearance = "dark"

# ============================================================
# 全局中性色（不随预设变化）
#
# 板面层级（由深到浅）：
#   surface_low  最深，凹陷/侧边栏
#   surface      面板底色
#   surface_high 卡片/按钮凸起面
#   surface_hover 悬停面
# 描边：
#   border       常规描边
#   border_soft  更弱的描边
# 语义色：danger / success / warning / info
# 文字三阶：text_primary / text_secondary / text_dim
# ============================================================

[common]
surface_low = "#090C13"
surface = "#10141D"
surface_high = "#181E2B"
surface_hover = "#222A3B"
border = "#2B3446"
border_soft = "#1F2634"
danger = "#FF5C6C"
success = "#3ED88C"
warning = "#FFC24B"
info = "#5B8CFF"
text_primary = "#F2F5FB"
text_secondary = "#A6B1C9"
text_dim = "#5C6883"

# ============================================================
# 强调色预设（primary 三阶 + secondary）
#
# primary / primary_light(淡) / primary_dark(暗)
#   用于强调元素：激活的导航、选中项、进度、焦点、主要按钮
# secondary
#   用于需要区分主次的次要强调
#
# 文字色与板面色由 [common] 提供，预设可选择性覆盖。
# ============================================================

# --- 蓝（默认）---
[preset_blue]
primary = "#5B8CFF"
primary_light = "#93B4FF"
primary_dark = "#2F55C8"
secondary = "#7C8FD6"

# --- 粉 ---
[preset_pink]
primary = "#FF5C93"
primary_light = "#FF94BA"
primary_dark = "#C22A61"
secondary = "#C87DA4"

# --- 绿 ---
[preset_green]
primary = "#2FD07A"
primary_light = "#6FE9A8"
primary_dark = "#178A4C"
secondary = "#5FB98D"

# --- 黄 ---
[preset_yellow]
primary = "#FFC24B"
primary_light = "#FFDA8F"
primary_dark = "#B47F14"
secondary = "#C9A45F"

# --- 紫 ---
[preset_violet]
primary = "#A06BFF"
primary_light = "#C6A4FF"
primary_dark = "#6C38CC"
secondary = "#9A80D6"

# --- 青 ---
[preset_cyan]
primary = "#22D3E0"
primary_light = "#74E9F0"
primary_dark = "#128995"
secondary = "#54B4BE"

# ============================================================
# 背景配置（每个视图独立）
#
# type 可选：
#   gradient — 渐变（默认垂直，可调 fill_from/to 坐标实现斜向）
#   solid    — 纯色
#   image    — 图片（从 BackgroundImage 目录加载）
#   cover    — 封面（仅 play 视图，由 PlayView 自行处理封面 + 模糊烘焙）
#
# gradient 参数：gradient_top/bottom(颜色) + from_x/y to_x/y(UV坐标)
# solid  参数：solid_color(颜色)
# image  参数：image_path(文件名) + image_stretch(cover|scale|tile|center|keep)
# cover  参数：cover_blur(0.0-1.0 模糊强度)
# ============================================================
[backgrounds]
# --- 主界面（垂直渐隐，冷调深色）---
bg_main_type = "gradient"
bg_main_gradient_top = "#0B0F1C"
bg_main_gradient_bottom = "#161E33"
bg_main_gradient_from_x = 0.0
bg_main_gradient_from_y = 0.0
bg_main_gradient_to_x = 0.0
bg_main_gradient_to_y = 1.0

# --- 商店（image）---
bg_store_type = "image"
bg_store_image_path = "nasa-carina-nebula.jpg"
bg_store_image_stretch = "cover"

# --- 结算（solid）---
bg_score_type = "solid"
bg_score_solid_color = "#0A0D14"

# --- 演奏（gradient 垂直）---
bg_play_type = "gradient"
bg_play_gradient_top = "#10162A"
bg_play_gradient_bottom = "#070A12"
bg_play_gradient_from_x = 0.0
bg_play_gradient_from_y = 0.0
bg_play_gradient_to_x = 0.0
bg_play_gradient_to_y = 1.0
# 演奏界面仅在 type=cover 时生效：封面模糊强度（0.0-1.0）
bg_play_cover_blur = 0.35
# 演奏界面仅在 type=image 时生效：背景图片文件名 + 拉伸模式
bg_play_image_path = ""
bg_play_image_stretch = "cover"
# 演奏界面仅在 type=solid 时生效：纯色背景颜色
bg_play_solid_color = "#0A0D14FF"

# --- 音轨（对角线：左下→右上）---
bg_track_type = "gradient"
bg_track_gradient_top = "#0F1626"
bg_track_gradient_bottom = "#080B13"
bg_track_gradient_from_x = 0.0
bg_track_gradient_from_y = 1.0
bg_track_gradient_to_x = 1.0
bg_track_gradient_to_y = 0.0

# --- 谱面详情（垂直）---
bg_midi_type = "gradient"
bg_midi_gradient_top = "#0B0F1A"
bg_midi_gradient_bottom = "#0A0D15"
bg_midi_gradient_from_x = 0.0
bg_midi_gradient_from_y = 0.0
bg_midi_gradient_to_x = 0.0
bg_midi_gradient_to_y = 1.0

# --- 设置（垂直）---
bg_setting_type = "gradient"
bg_setting_gradient_top = "#0B0F1A"
bg_setting_gradient_bottom = "#0A0D15"
bg_setting_gradient_from_x = 0.0
bg_setting_gradient_from_y = 0.0
bg_setting_gradient_to_x = 0.0
bg_setting_gradient_to_y = 1.0

# ============================================================
# 字号定义
# ============================================================
[font_sizes]
small = 22
body = 28
medium = 32
large = 40
title = 48
display = 72
